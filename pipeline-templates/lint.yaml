parameters:
  pool: ''

jobs:
  - job: ESLint
    pool:
      ${{ parameters.pool }}
    displayName: '🧶 ESLint'
    steps:
    - template: install-node.yaml
    - script: build.cmd
      displayName: 💻 Build Windows to Install Deps
    - pwsh: |
        npm ci eslint@8.57.0 @typescript-eslint/parser@8.0.0 @typescript-eslint/eslint-plugin@8.0.0 eslint-plugin-header@3.1.1 --save-dev
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        npm run lint
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: 🧶 Run Lint
