parameters:
  pool: ''
  SignType: ''
  TestBuild: 'false'

jobs:
- job: ${{ parameters.pool.os }}_Package
  pool:
    ${{ parameters.pool }}
  displayName: '📦 Package and Publish'
  strategy:
    matrix:
      Runtime:
        dir-name: 'vscode-dotnet-runtime-extension'
        package-name: 'vscode-dotnet-runtime'
  templateContext:
    outputs:
    - output: pipelineArtifact
      displayName: '📂 Publish .VSIX'
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifactName: '$(dir-name)'
    - output: pipelineArtifact
      displayName: '🗂️ Publish Package Files'
      targetPath: '$(Build.ArtifactStagingDirectory)/package_files'
      artifactName: 'package_files'
  steps:
  - template: install-node.yaml
  - pwsh: |
      $version = (node -p "require('./package.json').version").Trim()
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      npm version $version --allow-same-version
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      Write-Host "##vso[task.setvariable variable=version;isOutput=true]$version"

      $patchVersion = [int]($version.Split('.')[-1])
      $isPrerelease = ($patchVersion % 2) -eq 1
      Write-Host "##vso[task.setvariable variable=isPrerelease;isOutput=true]$($isPrerelease.ToString().ToLowerInvariant())"
      if ($isPrerelease) {
        Write-Host "Version $version has odd patch number ($patchVersion) - will be marked as prerelease"
      } else {
        Write-Host "Version $version has even patch number ($patchVersion) - will be marked as stable release"
      }
    name: GetVersion
    displayName: '❓ Get Version and Determine Prerelease Status'
    workingDirectory: $(dir-name)
  - ${{ if eq(parameters.useOneEngineeringPool, 'true') }}:
    - template: prepare-signing.yaml
      parameters:
        SignType: ${{ parameters.SignType }}
  - pwsh: |
      $installScriptsDir = 'vscode-dotnet-runtime-library/install scripts'
      $scriptUrls = @{
        'dotnet-install.ps1' = 'https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1'
        'dotnet-install.sh'  = 'https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh'
      }
      foreach ($fileName in $scriptUrls.Keys) {
        $url = $scriptUrls[$fileName]
        $outPath = Join-Path $installScriptsDir $fileName
        $downloaded = $false
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          try {
            Invoke-WebRequest -Uri $url -OutFile $outPath -UseBasicParsing
            $downloaded = $true
            Write-Host "✅ Downloaded $fileName (attempt $attempt)"
            break
          } catch {
            Write-Host "⚠️ Attempt $attempt failed for $fileName`: $($_.Exception.Message)"
          }
        }
        if (-not $downloaded) {
          Write-Error "❌ Failed to download $fileName after 3 attempts. Cannot bundle install scripts."
          exit 1
        }
      }
      Write-Host "✅ Install scripts bundled successfully."
    displayName: '📥 Download and Bundle Install Scripts'
  - pwsh: |
      npm ci rimraf --registry=https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      npm ci @vscode/vsce --registry=https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      $packageName = '$(package-name)'
      $version = '$(GetVersion.version)'
      $vsixName = "$packageName-$version.vsix"
      $manifestName = "$packageName-$version.manifest"

      if ('$(GetVersion.isPrerelease)' -eq 'true') {
        Write-Host "Packaging as prerelease..."
        npx vsce package -o $vsixName --ignoreFile ../.vscodeignore --yarn --pre-release
      } else {
        Write-Host "Packaging as stable release..."
        npx vsce package -o $vsixName --ignoreFile ../.vscodeignore --yarn
      }
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      npx vsce generate-manifest -i $vsixName -o $manifestName
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      Copy-Item $vsixName "../packages/$vsixName"
      Copy-Item $manifestName "../packages/$manifestName"
      Copy-Item $manifestName "../packages/$packageName-$version.signature.p7s"
    displayName: 📦 Package Artifact
    workingDirectory: $(dir-name)
    env:
      SignType: ${{ parameters.SignType }}
      TestBuild: ${{ parameters.TestBuild }}
  - pwsh: |
      Add-Type -AssemblyName System.IO.Compression.FileSystem
      $packagesDir = '../packages'
      $installScriptsDirInVsix = 'extension/dist/install scripts'
      $requiredScripts = @(
        "$installScriptsDirInVsix/dotnet-install.ps1",
        "$installScriptsDirInVsix/dotnet-install.sh"
      )
      $vsixFiles = Get-ChildItem -Path $packagesDir -Filter '*.vsix' -Recurse
      if ($vsixFiles.Count -eq 0) {
        Write-Error "❌ No VSIX files found in $packagesDir."
        exit 1
      }
      $anyFailed = $false
      foreach ($vsix in $vsixFiles) {
        Write-Host "🔍 Verifying install scripts in: $($vsix.Name)"
        $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix.FullName)
        try {
          $vsixEntries = $zip.Entries | ForEach-Object { $_.FullName }
          foreach ($script in $requiredScripts) {
            if ($vsixEntries -contains $script) {
              Write-Host "  ✅ Found: $script"
            } else {
              Write-Host "  ❌ Missing: $script"
              $anyFailed = $true
            }
          }
        } finally {
          $zip.Dispose()
        }
      }
      if ($anyFailed) {
        Write-Error "❌ One or more install scripts are missing from the VSIX. The extension will not be able to fall back to bundled scripts."
        exit 1
      }
      Write-Host "✅ All install scripts are present in the VSIX."
    displayName: '🔍 Verify Install Scripts are Bundled in VSIX'
    workingDirectory: $(dir-name)
  - template: list-file-structure.yaml
  - pwsh: |
      $target = Join-Path '$(Build.ArtifactStagingDirectory)' 'package_files'
      if (-not (Test-Path $target)) {
        New-Item -ItemType Directory -Path $target | Out-Null
      }

      $source = Join-Path '$(Build.SourcesDirectory)' '$(dir-name)'
      $files = @('package.json', 'package-lock.json', '.npmrc', 'yarn.lock', '.yarnrc')

      foreach ($file in $files) {
        $sourcePath = Join-Path $source $file
        if (Test-Path $sourcePath) {
          Copy-Item -Path $sourcePath -Destination (Join-Path $target $file) -Force
        }
      }
    displayName: '📁 Stage Package Files for Consumption to Enable NPM CI'
  - script: dotnet build msbuild/signVsix -v:normal
    displayName: 🖊️ Sign VSIXes
    env:
      SignType: ${{ parameters.SignType }}
      TestBuild: ${{ parameters.TestBuild }}
  - ${{ if eq(variables['Build.Reason'], 'IndividualCI') }}:
    - pwsh: |
        Function Spawn-Tool($command, $commandArgs, $retryCount=0) {
          Write-Host "$pwd >"
          for (; $retryCount -ge 0; $retryCount--) {
            Write-Host "##[command]$command $commandArgs"
            $output = Invoke-Expression "$command $commandArgs" # Do not use @commandArgs because it quotes '-Target', breaking the script.
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Task failed with exit code $LASTEXITCODE. $retryCount retries left."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          return $output
        }

        $anyFailed = $false
        $vsixes = Get-ChildItem -Path ../packages -Filter *.vsix -Recurse
        foreach ($vsix in $vsixes) {
          $baseName = "$($vsix.DirectoryName)\$($vsix.BaseName)"
          $manifestFile = $baseName + ".manifest"
          $signatureFile = $baseName + ".signature.p7s"

          $vsceVerifyArgs = '@vscode/vsce','verify-signature','--packagePath',$vsix,'--manifestPath',$manifestFile,'--signaturePath',$signatureFile
          $output = Spawn-Tool 'npx' $vsceVerifyArgs

          # This is a brittle check but the command does not return a non-zero exit code for failed validation.
          # Opened https://github.com/microsoft/vscode-vsce/issues/1192 to track this.
          if ($output.Contains('Signature verification result: Success')) {
            Write-Host "Signature verification succeeded for $vsix"
          } else {
            Write-Host ($output | Out-String)
            Write-Host "##[error]Signature verification failed for $vsix"
            $anyFailed = $true
          }
        }

        if ($anyFailed) {
            exit 1
        }
      displayName: 🔑 Verify VSIX Signature Files
      workingDirectory: $(dir-name)
  - task: CopyFiles@2
    displayName: '📩 Copy Artifact'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: '**\$(package-name)-$(GetVersion.version)*.*'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      flattenFolders: true
  - task: CopyFiles@2
    displayName: '🏗️ Copy Binlog'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: '**\*.binlog'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      flattenFolders: false